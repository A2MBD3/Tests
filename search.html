<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Register Page</title>
  <!-- Lottie Player Script (ক্যারেক্টার অ্যানিমেশনের জন্য) -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  
  <style>
    /* বেসিক পেজ স্টাইল */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0F172A; /* গাঢ় ব্যাকগ্রাউন্ড */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* মূল কন্টেইনার */
    .container {
      text-align: center;
      padding: 30px;
      border-radius: 20px;
    }

    /* অ্যানিমেটেড ক্যারেক্টার (Lottie Player) */
    .character-container {
      width: 250px;
      height: 250px;
      margin: 0 auto;
      margin-bottom: 10px;
    }

    /* সবুজ বাটন স্টাইল */
    .register-btn {
      background-color: #03D98A; /* উজ্জ্বল সবুজ */
      color: #000;
      padding: 15px 40px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 5px 15px rgba(3, 217, 138, 0.4);
    }

    /* বাটন হোভার এফেক্ট */
    .register-btn:hover {
      background-color: #02b673;
      transform: scale(1.05) translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- অ্যানিমেটেড ক্যারেক্টার (Lottie Animation) -->
    <div class="character-container">
      <lottie-player 
        src="https://assets10.lottiefiles.com/packages/lf20_w51p443u.json"  /* ডেমো ক্যারেক্টার JSON */
        background="transparent"  
        speed="1"  
        loop  
        autoplay>
      </lottie-player>
    </div>

    <!-- REGISTER NOW বাটন -->
    <button class="register-btn">REGISTER NOW</button>
  </div>

</body>
</html>
